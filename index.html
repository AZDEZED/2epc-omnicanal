r:0;border-top:1px solid #dce5ef;margin:13px 0}.card{background:white;border:1px solid #d7e1ec;border-radius:18px;padding:clamp(17px,3vw,27px);box-shadow:0 6px 24px #2039500a;margin-bottom:14px}.welcome{background:linear-gradient(135deg,#e5f1ff,#fff 70%);border-left:7px solid #1765a4}.kicker{font-size:12px;font-weight:900;letter-spacing:.075em;color:#165a94;text-transform:uppercase}.card h2{font-size:clamp(24px,3.6vw,39px);line-height:1.14;margin:8px 0 14px}.card h3{font-size:22px;line-height:1.25;margin:0 0 14px}.card p{margin:8px 0 12px}.sub{color:#567086}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{font-size:12px;border-radius:100px;padding:6px 9px;background:#e6f2fc;color:#174c78;font-weight:800}.chip.green{background:#e3f5e8;color:#166335}.miniCards,.trio,.duo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.duo{grid-template-columns:repeat(2,minmax(0,1fr))}.miniCards>*,.trio>*,.duo>*{border-radius:13px;background:#f3f8fc;border:1px solid #d6e5f0;padding:13px}.miniCards b,.trio b,.duo b{display:block;color:#154e7d}.trio p,.duo p{font-size:15px;margin:4px 0}.trio small,.duo small{font-size:12px;color:#566e84}.scene{background:#fff6e7;border-left:6px solid #f09b2d;border-radius:11px;padding:15px 16px;font-size:18px}.note{background:#edf7ec;border-left:5px solid #329357;padding:12px 15px;border-radius:10px}.timeline{margin:10px 0;padding-left:24px}.timeline li{padding:5px 0;border-bottom:1px solid #e9edf2}.options{display:grid;gap:9px;margin:16px 0}.option{display:flex;align-items:start;gap:10px;text-align:left;border:2px solid #dae3ed;border-radius:12px;background:#fff;padding:12px;min-height:53px;color:#203450;font-weight:650}.option:hover{background:#f5f9fd}.option.selected{border-color:#1564a2;background:#e6f2fc}.marker{flex:0 0 24px;display:flex;align-items:center;justify-content:center;height:24px;border-radius:7px;background:#e3ebf3;color:#355778;font-size:13px;font-weight:900}.question{font-size:19px;font-weight:750;line-height:1.4;background:#f5f8fc;padding:13px 16px;border-radius:13px;border-left:6px solid #2b78b3}.btn{background:#145e9a;color:white;border:0;border-radius:12px;padding:11px 16px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;min-height:44px;gap:8px}.btn:hover{background:#0c4676}.btn.secondary{background:#e8eef5;color:#244361}.btn.secondary:hover{background:#d3e1ed}.btn.green{background:#208352}.btn.purple{background:#7641a0}.btn:disabled{opacity:.42;cursor:not-allowed}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 0;flex-wrap:wrap}.actions>div{display:flex;gap:9px;flex-wrap:wrap}.feedback{border-radius:13px;padding:15px 17px;margin:12px 0;border:1px solid #cde2d1;background:#effaf2}.feedback.error{background:#fff2ed;border-color:#f2c7ba}.feedback b{display:block;margin-bottom:5px}.feedback ul{padding-left:21px}.feedback p{margin:7px 0}.hint{border-radius:11px;background:#fff8dc;border-left:5px solid #e3ad20;padding:11px 15px;margin:10px 0}.hint p{margin:0}.write{width:100%;min-height:115px;border:2px solid #ccdce9;border-radius:12px;padding:12px;resize:vertical;background:#fcfeff}.teacherBox{border:1px dashed #d89839;border-radius:12px;background:#fff6df;padding:13px;margin-top:13px}.teacherBox h4{margin:0 0 6px}.alert{border-radius:11px;background:#fff6db;padding:12px 15px;border-left:5px solid #dea522}.formBox{border-radius:14px;background:#f4eefe;padding:19px;border-left:6px solid #8053bb}.formBox .btn{margin:9px 0}.pageIntro{margin-bottom:14px}.pageIntro .kicker{margin-bottom:5px}.stepbar{display:flex;gap:10px;align-items:center;margin:5px 0 18px}.stepbar>div{height:9px;border-radius:100px;background:#dbe7f0;flex:1;overflow:hidden}.stepbar span{display:block;height:100%;background:#299862;border-radius:100px}.stepbar small{color:#55708b;white-space:nowrap;font-size:12px;font-weight:800}.taskLabel{color:#7a578e;font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}.tilegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{background:#fff;border:1px solid #d6e2ee;border-radius:15px;padding:18px}.tile h3{margin:0 0 8px}.tile p{font-size:14px;color:#526d83}.tile .btn{margin-top:7px}.searchrow{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0}.searchrow input,.searchrow select{border:1px solid #b7c8d9;padding:10px;border-radius:10px;background:white;min-height:43px}.searchrow input{flex:2 1 230px}.searchrow select{flex:1 1 180px}.lexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:10px}.lexitem{padding:13px 15px;border:1px solid #dde6ef;border-radius:12px;background:#fff}.lexitem b{display:block;color:#205884}.lexitem .cat{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#6c8094;font-weight:700}.lexitem small{display:block;color:#42607b;margin-top:6px}.lexitem p{font-size:14px;line-height:1.35}.vocabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.vocabbar div{background:#f1f6fb;padding:12px;text-align:center;border-radius:12px}.vocabbar strong{display:block;font-size:23px;color:#194f82}.vocabControls{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.vocabControls select{min-height:42px;border:1px solid #b9cbda;border-radius:10px;padding:8px}.vocabActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.reviewLine{font-size:13px;color:#526b83}.progresscards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:17px 0}.progresscards div{padding:13px;background:#f1f7ff;border-radius:13px}.progresscards b{font-size:24px;display:block;color:#145489}.empty{color:#55708d;font-size:14px}@media(max-width:850px){.masthead{position:relative}.maincols{grid-template-columns:1fr}.side{position:static;top:auto}.trio,.miniCards{grid-template-columns:1fr}.duo{grid-template-columns:1fr}}@media(max-width:550px){.mastinner{align-items:start}.mastinner h1{font-size:24px}.card{padding:15px}main{padding:0 12px}.actions .btn{flex:1}.progresscards{grid-template-columns:1fr}.vocabbar{grid-template-columns:repeat(3,1fr)}.headbtn{padding:7px;font-size:12px}}

.message-list{padding-left:25px}.message-list li{background:#f1f6fb;border:1px solid #d2dfed;border-radius:12px;padding:12px;margin:10px 0}.message-list p{margin:0 0 10px}.sentence-tools{display:flex;gap:8px;flex-wrap:wrap}.option:disabled{opacity:.55;cursor:default}.catalogue{border:2px solid #a9cce6;border-radius:15px;padding:18px;background:#f3f9ff}.catalogue label{display:block;font-weight:750;margin:15px 0}.catalogue select{display:block;width:100%;max-width:100%;padding:12px;border:1px solid #a2b9d0;border-radius:10px;background:white;font:inherit;margin-top:7px}details{padding:14px;border:1px solid #cbdde9;border-radius:12px;margin:14px 0}summary{cursor:pointer;font-weight:750}@media(max-width:550px){.mastinner{flex-wrap:wrap}.sentence-tools .btn{min-width:44px}.sidebtn{font-size:14px}}

<script>
window.APP_DATA = {"missions":[{"key":"M1","title":"Les canaux : repérer où le client achète","goal":"Reconnaître un canal de vente et distinguer communication, achat et retrait.","minutes":55,"steps":[{"type":"lesson","title":"Votre mission professionnelle","html":"<p class=\"scene\">Vous travaillez chez <strong>Nova Sport</strong>. Nora découvre des baskets dans une story, clique vers le site de l’enseigne, achète une paire puis la retire en magasin.</p><p><strong>Votre mission :</strong> expliquer à Nora quel canal sert à découvrir le produit, lequel sert à acheter et où elle va récupérer sa commande.</p>","min":4},{"type":"choice","title":"Observer avant d’apprendre","prompt":"Où Nora réalise-t-elle réellement son achat ?","choices":["Sur le réseau social qui affiche la publicité","Sur le site marchand de Nova Sport","Au comptoir où elle retire le colis","Dans la réserve où il est préparé"],"answers":[1],"reason":"La publicité donne envie de découvrir. Le site permet ici de passer et payer la commande. Le magasin sert au retrait.","hints":["Repère l’endroit où Nora valide et paie sa commande.","Découvrir un produit et l’acheter sont deux actions différentes."],"transfer":{"prompt":"Un client voit une promotion TikTok puis paie sur le site officiel. Où la vente a-t-elle lieu ?","choices":["Dans l’entrepôt","Sur TikTok","Sur le site marchand","Au point relais"],"answers":[2],"reason":"Le paiement sur le site identifie le canal de vente."},"min":4},{"type":"lesson","title":"Une idée clé : trois actions différentes","html":"<div class=\"trio\"><div><b>📣 Découvrir</b><p>Publicité, story, vitrine : le client repère le produit.</p></div><div><b>🛒 Acheter</b><p>Magasin ou site marchand : le client effectue son achat.</p></div><div><b>📦 Recevoir</b><p>Retrait en magasin ou livraison : il récupère le produit.</p></div></div><p class=\"note\">Un réseau social n’est pas automatiquement un canal de vente : il l’est seulement si l’achat peut réellement y être effectué.</p>","min":4},{"type":"choice","title":"Distinguer les situations","prompt":"Quelles situations correspondent clairement à un <strong>achat</strong> réalisé par le client ? <em>Plusieurs réponses possibles.</em>","choices":["Le client règle un produit à la caisse du magasin","Le client regarde une story sans cliquer","Le client commande et paie sur le site marchand","Le client reçoit simplement un message de confirmation"],"answers":[0,2],"reason":"Acheter signifie réaliser la transaction : à la caisse ou sur le site. Regarder une publicité ou recevoir une confirmation ne constitue pas un nouvel achat.","hints":["Cherche à quel moment le client valide l’achat.","Deux propositions correspondent à un règlement effectif."],"transfer":{"prompt":"Dans quelles situations le client est-il seulement informé ?","choices":["Lecture d’un message publicitaire","Paiement à la caisse","Consultation d’une fiche produit sans commande","Validation et paiement sur le site"],"answers":[0,2],"reason":"Lire une publicité et consulter une fiche n’engagent pas encore un achat."},"min":5},{"type":"lesson","title":"Les canaux les plus utilisés","html":"<div class=\"trio\"><div><b>🏬 Magasin physique</b><p>On peut y acheter et être conseillé.</p></div><div><b>💻 Site marchand</b><p>On peut consulter, commander et payer.</p></div><div><b>📱 Application mobile</b><p>Elle peut informer et parfois permettre d’acheter.</p></div></div><p><strong>Autres contacts :</strong> téléphone et réseaux sociaux peuvent informer ou accompagner le client selon les fonctionnalités proposées.</p>","min":4},{"type":"choice","title":"Analyser une application","prompt":"Une enseigne possède une application sur laquelle les clients peuvent vérifier le stock et payer. Quelle analyse est la plus précise ?","choices":["C’est seulement un support publicitaire","C’est un outil numérique qui sert aussi de canal de vente","C’est forcément un magasin physique","C’est un outil de stockage réservé aux employés"],"answers":[1],"reason":"L’application peut informer et permettre un achat : sa fonction dépend de ce qu’elle permet de faire, pas simplement de son nom.","hints":["Cherche deux actions possibles dans la situation.","Le mot « payer » indique qu’une vente est possible."],"transfer":{"prompt":"Une application indique seulement les horaires et les promotions, sans panier ni paiement. Quel rôle est certain ?","choices":["Canal de vente obligatoire","Outil d’information/communication","Caisse magasin","Réserve numérique"],"answers":[1],"reason":"Elle informe le client, mais le scénario ne décrit aucun achat dans cette application."},"min":5},{"type":"assemble","title":"Expliquez le rôle de chaque canal","prompt":"Nora a découvert les baskets dans une story, payé sur le site puis retiré sa commande en magasin. Construisez une réponse en 3 phrases : découverte → achat → retrait.","bank":[{"text":"Le magasin vous a remis la commande passée en ligne.","why":"Le magasin est ici le lieu du retrait, dernière étape décrite."},{"text":"La story a enregistré votre achat.","why":"La story a présenté le produit ; aucun achat dans le réseau social n’est décrit."},{"text":"La story vous a permis de découvrir les baskets.","why":"C’est le premier contact, avant la commande."},{"text":"Le retrait en magasin constitue un deuxième achat.","why":"La commande est déjà payée : le retrait ne crée pas une deuxième vente."},{"text":"Vous avez commandé et payé sur le site marchand.","why":"Le site a permis la transaction, entre découverte et retrait."},{"text":"Le site a seulement présenté une publicité.","why":"Nora a aussi commandé et payé sur ce site."},{"text":"Vous devez payer à nouveau lors du retrait.","why":"La situation indique que le paiement est déjà réalisé."},{"text":"La story et le site ont nécessairement vendu chacun une paire.","why":"Plusieurs contacts ne signifient pas plusieurs achats."}],"order":[2,4,0],"reason":"L’ordre suit les faits : la story fait découvrir, le site permet d’acheter et le magasin assure le retrait.","transfer":{"prompt":"Lina voit une affiche puis achète à la caisse. Quel message convient ?","choices":["L’affiche a encaissé votre achat.","Le magasin a seulement communiqué.","L’affiche vous a informée ; l’achat a été réalisé au magasin.","Vous avez acheté deux fois."],"answers":[2],"reason":"L’affiche informe ; la caisse du magasin réalise la vente."},"min":6,"documents":"","hints":["Distinguez les faits confirmés des suppositions. Relisez les documents et écartez les promesses non vérifiées.","Sélectionnez uniquement les informations utiles. Respectez ensuite les étapes annoncées dans la consigne."]},{"type":"choice","title":"Décider en tant qu’équipier","prompt":"Un client veut savoir si l’article vu sur le site est disponible aujourd’hui en magasin. Quelle action est la plus professionnelle ?","choices":["Affirmer qu’il est forcément en stock","Consulter l’outil de stock ou demander à un collègue habilité","Dire qu’internet ne concerne pas le magasin","Lui vendre un autre article sans vérifier"],"answers":[1],"reason":"L’équipier vérifie une information fiable avant d’orienter le client. Les canaux se complètent, mais ne garantissent pas automatiquement la disponibilité.","hints":["Le client a besoin d’une information certaine.","Quelle action évite d’inventer la disponibilité ?"],"transfer":{"prompt":"Le stock en ligne semble incertain. Que dites-vous ?","choices":["« Je vais vérifier la disponibilité. »","« Venez sans vérifier, il y en aura. »","« Je ne sais pas et cela ne me concerne pas. »","« Prenez-en un autre. »"],"answers":[0],"reason":"Vérifier puis informer est l’attitude professionnelle adaptée."},"min":4},{"type":"form","title":"Validation Google Forms M1","key":"M1","min":8},{"type":"summary","title":"À retenir — Mission 1","html":"<p>Un <b>canal de vente</b> permet d’effectuer l’achat. Une <b>communication</b> fait connaître le produit. Le <b>retrait</b> ou la <b>livraison</b> permettent de le récupérer.</p><p>Je sais différencier ces actions dans un parcours client.</p>","min":2}]},{"key":"M2","title":"Multicanal ou omnicanal ?","goal":"Comprendre si plusieurs canaux travaillent séparément ou se complètent.","minutes":55,"steps":[{"type":"lesson","title":"Votre mission professionnelle","html":"<p class=\"scene\">Nova Sport possède un magasin, un site et une application. Un client commence à choisir ses chaussures sur le site et souhaite retrouver sa commande au magasin.</p><p><b>Votre mission :</b> expliquer ce qui change lorsque les canaux communiquent entre eux.</p>","min":4},{"type":"choice","title":"Observer une difficulté","prompt":"Le magasin ne peut pas retrouver une commande faite sur le site. Que montre cette situation ?","choices":["Les canaux existent mais ne partagent pas cette information","Le client a nécessairement perdu son argent","Le magasin est déjà parfaitement omnicanal","Une application remplace toutes les procédures"],"answers":[0],"reason":"Avoir plusieurs canaux ne garantit pas qu’ils partagent les informations. C’est précisément la différence à comprendre.","hints":["Concentre-toi sur ce que le magasin ne peut pas retrouver.","Plusieurs canaux peuvent être utilisés séparément."],"transfer":{"prompt":"Le magasin et le site existent mais leurs paniers ne se synchronisent pas. Quelle expression convient ?","choices":["Un seul canal","Des canaux séparés","Un panier omnicanal confirmé","Une livraison à domicile"],"answers":[1],"reason":"Les canaux coexistent sans continuité démontrée."},"min":4},{"type":"lesson","title":"Comparer deux façons de vendre","html":"<div class=\"duo\"><div><b>🧱 Multicanal</b><p>Une enseigne utilise plusieurs canaux. Ils peuvent fonctionner de manière séparée.</p><small>Exemple : magasin et site sans accès commun aux commandes.</small></div><div><b>🔗 Omnicanal</b><p>Les canaux se complètent pour que le client poursuive son parcours.</p><small>Exemple : commande en ligne récupérée en magasin.</small></div></div><p class=\"note\"><b>Astuce :</b> demande-toi : « Le passage d’un canal à l’autre est-il organisé ? »</p>","min":4},{"type":"choice","title":"Repérer l’omnicanalité","prompt":"Quelles situations montrent clairement des canaux qui se complètent ? <em>Plusieurs réponses possibles.</em>","choices":["Une commande passée sur le site est préparée puis retirée en magasin","Une publicité est affichée sur Instagram, sans autre interaction décrite","Un panier commencé dans l’application est retrouvé en magasin","Deux magasins vendent des produits différents sans lien entre eux"],"answers":[0,2],"reason":"Dans les bonnes situations, l’enseigne permet de continuer l’achat entre outils numériques et magasin. Une publicité isolée ne suffit pas.","hints":["Repère les situations où une action commence ici et se poursuit ailleurs.","Deux exemples montrent une transmission ou un suivi entre canaux."],"transfer":{"prompt":"Quel exemple montre un parcours relié ?","choices":["Une affiche sur un mur","Un site et un magasin sans lien","Une réservation sur le site confirmée et retrouvée au comptoir","Une vitrine décorée"],"answers":[2],"reason":"Le magasin retrouve la réservation effectuée en ligne."},"min":5},{"type":"lesson","title":"Ce qui rend un parcours fluide","html":"<div class=\"trio\"><div><b>1. Information</b><p>L’enseigne fournit une information cohérente sur les produits.</p></div><div><b>2. Commande</b><p>L’équipe peut retrouver les éléments nécessaires à la préparation.</p></div><div><b>3. Retrait</b><p>Le client récupère son achat dans les conditions annoncées.</p></div></div><p>Pour l’équipier, être omnicanal n’est pas « être partout » : c’est <b>accompagner le passage entre les canaux</b>.</p>","min":4},{"type":"choice","title":"Comprendre une limite","prompt":"Le client montre une promotion de l’application qui ne s’affiche pas en caisse. Que faut-il en déduire ?","choices":["La réduction doit être appliquée sans vérification","Une information peut nécessiter une vérification entre les canaux","Le client a nécessairement menti","Les applications ne sont jamais utiles en magasin"],"answers":[1],"reason":"Un parcours cohérent exige de vérifier les conditions de l’offre et les outils disponibles. L’équipier ne promet pas une réduction sans contrôle.","hints":["On ne peut pas conclure sur la validité sans vérifier.","Cherche la réponse qui respecte la procédure professionnelle."],"transfer":{"prompt":"La promotion en ligne a des conditions spécifiques. Quelle action est adaptée ?","choices":["Expliquer après avoir vérifié les conditions","Promettre n’importe quelle remise","Modifier seul l’étiquette","Refuser sans regarder"],"answers":[0],"reason":"On vérifie d’abord les conditions puis on explique au client."},"min":5},{"type":"assemble","title":"Construisez une explication au client","prompt":"Cas A : magasin et site sans accès commun aux commandes. Cas B : commande en ligne retrouvée et préparée au magasin. Sélectionnez 3 phrases dans cet ordre : cas A → cas B → intérêt pour le client.","bank":[{"text":"Vous pouvez ainsi poursuivre votre achat d’un canal à l’autre.","why":"C’est le bénéfice illustré par le cas B."},{"text":"Dans le cas A, la présence du site garantit le partage des commandes.","why":"L’accès commun est explicitement absent."},{"text":"Dans le cas B, le site et le magasin partagent le suivi de la commande.","why":"Le magasin retrouve et prépare la commande en ligne."},{"text":"Dans les deux cas, le passage entre canaux est organisé de la même façon.","why":"Le cas A ne présente pas cette continuité."},{"text":"Dans le cas A, les canaux fonctionnent séparément pour les commandes.","why":"Cette phrase décrit la limite donnée dans le document."},{"text":"Le cas B garantit que tous les articles sont toujours disponibles.","why":"Le suivi commun ne garantit pas un stock permanent."},{"text":"Un deuxième canal supprime automatiquement les erreurs.","why":"Aucune organisation ne permet cette garantie absolue."},{"text":"Le magasin doit ignorer une commande passée sur internet.","why":"Dans le cas B, sa prise en charge est organisée."}],"order":[4,2,0],"reason":"La réponse compare les deux organisations avant d’expliquer la continuité du parcours.","transfer":{"prompt":"Une réservation en ligne est retrouvée au comptoir. Quelle explication convient ?","choices":["Les canaux assurent une continuité pour cette réservation.","Le magasin et le site sont forcément séparés.","Tous les produits sont toujours disponibles.","Le client doit effectuer une seconde réservation."],"answers":[0],"reason":"Le magasin retrouve l’information saisie sur le site."},"min":6,"documents":"","hints":["Distinguez les faits confirmés des suppositions. Relisez les documents et écartez les promesses non vérifiées.","Sélectionnez uniquement les informations utiles. Respectez ensuite les étapes annoncées dans la consigne."]},{"type":"choice","title":"Transfert en situation","prompt":"Un client choisit son article sur ordinateur puis reçoit un message lui annonçant qu’il est prêt à retirer. Quelle phrase est juste ?","choices":["Les canaux se complètent grâce à la préparation et à l’information","Le message constitue un nouvel achat indépendant","Le magasin n’a aucun rôle","Le retrait doit être réalisé sans vérifier la commande"],"answers":[0],"reason":"Le site, la préparation du magasin et la confirmation travaillent ensemble pour un même achat.","hints":["Le client effectue-t-il plusieurs achats ou un seul parcours ?","Le message assure la liaison entre commande et retrait."],"transfer":{"prompt":"Une cliente commence une demande de retour sur le site puis la finalise au magasin selon la procédure. C’est…","choices":["Un passage entre canaux","Une rupture de stock","Une erreur automatique","Une vente uniquement physique"],"answers":[0],"reason":"La procédure relie le site et le point de vente."},"min":4},{"type":"form","title":"Validation Google Forms M2","key":"M2","min":8},{"type":"summary","title":"À retenir — Mission 2","html":"<p><b>Multicanal :</b> plusieurs canaux existent. <b>Omnicanal :</b> plusieurs canaux se complètent dans un même parcours client.</p><p>Je sais justifier ma réponse avec un exemple concret.</p>","min":2}]},{"key":"M3","title":"Le parcours client omnicanal","goal":"Reconstituer les étapes et choisir l’action professionnelle adaptée.","minutes":55,"steps":[{"type":"lesson","title":"Votre mission professionnelle","html":"<p class=\"scene\">Samir voit un sac sur TikTok. Il vérifie la disponibilité sur le site Nova Sport, commande depuis son téléphone, reçoit une confirmation et vient retirer son sac en magasin.</p><p><b>Votre mission :</b> remettre les étapes dans l’ordre et préciser où l’équipier intervient.</p>","min":4},{"type":"choice","title":"Retrouver l’ordre du parcours","prompt":"Dans quel ordre Samir utilise-t-il les différents points de contact ?","choices":["Magasin → site → TikTok","TikTok → site → commande mobile → magasin","Réserve → TikTok → magasin → site","Site → magasin → TikTok → commande"],"answers":[1],"reason":"Samir découvre sur TikTok, vérifie sur le site, commande sur son téléphone puis vient au magasin. L’ordre correspond aux actions réelles.","hints":["Quel contact apparaît en premier dans le texte ?","Suis les verbes : voit → vérifie → commande → retire."],"transfer":{"prompt":"Lina voit une veste en story, vérifie sur le site et retire au magasin. Quel ordre convient ?","choices":["Story → site → magasin","Magasin → story → site","Site → magasin → story","Magasin → site → story"],"answers":[0],"reason":"C’est l’ordre chronologique de la situation."},"min":4},{"type":"lesson","title":"Les six étapes possibles","html":"<ol class=\"timeline\"><li><b>Découverte</b> du produit</li><li><b>Recherche / comparaison</b></li><li><b>Commande</b></li><li><b>Confirmation</b></li><li><b>Préparation et retrait / livraison</b></li><li><b>Échange ou retour éventuel</b></li></ol><p class=\"note\">Tous les clients ne passent pas par les six étapes. Le retour n’a lieu que si nécessaire.</p>","min":4},{"type":"choice","title":"Distinguer étapes et supports","prompt":"Quelles affirmations sont correctes ? <em>Plusieurs réponses possibles.</em>","choices":["Le parcours peut commencer avant l’achat","Le retrait en magasin signifie forcément un deuxième achat","Un message de confirmation peut informer que la commande est prête","Le retour éventuel se situe après la vente"],"answers":[0,2,3],"reason":"Le parcours commence souvent avant l’achat et peut continuer après. Le retrait n’est pas automatiquement une nouvelle vente.","hints":["Le parcours ne commence pas forcément à la caisse.","Trois affirmations décrivent les étapes ; une confond retrait et achat."],"transfer":{"prompt":"Quelles étapes peuvent intervenir après le paiement ?","choices":["La confirmation de commande","Le retrait du colis","La découverte initiale du produit","Un échange de taille"],"answers":[0,1,3],"reason":"Confirmation, retrait et échange éventuel peuvent survenir après l’achat."},"min":5},{"type":"lesson","title":"Où intervient l’équipier ?","html":"<div class=\"trio\"><div><b>🔎 Avant le retrait</b><p>Vérifier la commande et sa disponibilité selon les outils.</p></div><div><b>📦 Pendant la préparation</b><p>Identifier, contrôler et ranger la commande.</p></div><div><b>🤝 Au retrait</b><p>Accueillir, suivre la procédure, remettre le bon produit.</p></div></div><p>L’équipier peut aussi orienter le client lorsqu’il demande un échange ou une information.</p>","min":4},{"type":"choice","title":"Choisir des gestes professionnels","prompt":"Un colis préparé attend Samir. Quelles actions sont professionnelles ? <em>Plusieurs réponses possibles.</em>","choices":["Contrôler la référence de commande avant remise","Donner le premier paquet ayant la bonne taille","Suivre la procédure pour identifier la commande","Informer le responsable si le produit est introuvable"],"answers":[0,2,3],"reason":"Le bon colis doit être identifié. Les procédures évitent les remises erronées ; un problème doit être vérifié et signalé.","hints":["Imagine deux commandes semblables. Comment éviter une erreur ?","Trois propositions protègent le client et le magasin."],"transfer":{"prompt":"Une cliente présente une confirmation, mais la référence ne correspond pas au colis. Que faire ?","choices":["Remettre quand même","Vérifier et corriger l’erreur selon la procédure","Effacer le dossier","Envoyer le client en réserve"],"answers":[1],"reason":"On ne remet pas un colis dont la référence ne correspond pas."},"min":5},{"type":"assemble","title":"Préparez le message de retrait","prompt":"Procédure Nova Sport : après le message « prêt au retrait », le client présente la confirmation et la référence au comptoir. L’équipier vérifie la correspondance référence-colis avant remise. Construisez 3 phrases : moment du déplacement → documents à présenter → contrôle avant remise.","bank":[{"text":"Nous vérifierons la correspondance entre votre référence et le colis avant de vous le remettre.","why":"Ce contrôle sécurise la remise."},{"text":"Vous pouvez venir dès la validation du paiement, même sans avis de disponibilité.","why":"Le signal de retrait est le message « prêt au retrait »."},{"text":"Présentez votre confirmation et la référence de commande au comptoir.","why":"Ce sont les éléments prévus par cette procédure."},{"text":"La taille du paquet suffit pour reconnaître votre commande.","why":"Il faut comparer les références, pas l’apparence du paquet."},{"text":"Attendez notre message confirmant que votre commande est prête avant de vous déplacer.","why":"Cette confirmation évite un déplacement prématuré."},{"text":"Un article portant la même marque peut remplacer votre colis sans vérification.","why":"La marque ne suffit pas à identifier la commande."},{"text":"L’équipier vous remettra le colis avant tout contrôle pour gagner du temps.","why":"Le contrôle doit précéder la remise."},{"text":"Toute commande validée est immédiatement disponible au comptoir.","why": écupérer la commande.</p>","hints":["Distinguez les faits confirmés des suppositions. Relisez les documents et écartez les promesses non vérifiées.","Sélectionnez uniquement les informations utiles. Respectez ensuite les étapes annoncées dans la consigne."]},{"type":"summary","title":"Votre méthode à retenir","min":3,"html":"<p><b>Questionner → vérifier → comparer → expliquer.</b></p><p>Comparez le produit, le budget, le délai et le déplacement. Distinguez stock affiché, commande enregistrée et commande prête. Chaque phrase doit s’appuyer sur une information confirmée.</p>"},{"type":"choice","title":"Transfert : un besoin différent","prompt":"Maya veut un maillot avant vendredi soir. Elle peut aller à Centre jeudi. Retrait confirmé jeudi : 25 €, gratuit. Livraison estimée lundi : 29 € au total. Budget : 30 €. Quelle proposition convient ?","choices":["La livraison car elle respecte le budget","Le retrait jeudi à Centre, car il respecte le budget et le délai","Une remise à Gare sans y vérifier le stock","Les deux solutions respectent le délai"],"answers":[1],"reason":"Le prix seul ne suffit pas : la livraison arrive après l’échéance. Le retrait est confirmé et Maya peut se déplacer.","transfer":{"prompt":"Le client ne peut pas venir. Livraison confirmée demain : 22 €, budget 25 €, besoin dans trois jours. Quelle solution convient ?","choices":["Un retrait avec déplacement obligatoire.","Aucune solution car toute livraison est trop chère.","Une commande sans adresse.","La livraison, compatible avec le déplacement impossible, le délai et le budget."],"answers":[3],"reason":"Il faut vérifier les trois contraintes ensemble."},"hints":["Appuyez-vous sur les contraintes du client et les informations confirmées.","Ne confondez pas une possibilité affichée avec un engagement confirmé."],"min":5},{"type":"assemble","title":"Défi final : un autre client, une autre solution","prompt":"Choisissez 3 phrases : solution adaptée → justification par le délai et le budget → vérification avant validation.","bank":[{"text":"Le retrait gratuit à Gare est la meilleure solution puisque vous ne pouvez pas vous déplacer.","why":"La gratuité ne résout pas l’impossibilité de déplacement."},{"text":"Vérifions ensemble l’adresse de livraison et le récapitulatif avant de valider.","why":"Cette vérification évite une erreur de commande."},{"text":"Je vous propose la livraison à domicile.","why":"Elle répond à l’impossibilité de se déplacer."},{"text":"La livraison coûte 34 € au total et l’arrivée est confirmée jeudi, avant votre échéance.","why":"30 € + 4 € = 34 €, sous le budget de 35 € et avant vendredi soir."},{"text":"Vous pourrez retirer le sac même si personne ne peut aller au magasin.","why":"Le retrait nécessite un déplacement selon cette offre."},{"text":"Le retrait gratuit est toujours préférable à une livraison payante.","why":"Le meilleur choix dépend aussi des contraintes du client."},{"text":"Nous pouvons valider sans contrôler l’adresse puisque le délai est confirmé.","why":"Un délai confirmé n’empêche pas une erreur d’adresse."},{"text":"La livraison dépasse votre budget de 35 €.","why":"Le coût total de 34 € respecte le budget."}],"order":[2,3,1],"reason":"Le choix dépend du nouveau besoin : la livraison est ici adaptée au déplacement impossible, au délai et au budget.","transfer":{"prompt":"Un client peut venir ce soir et en a besoin demain. Retrait confirmé ce soir : gratuit. Livraison : lundi, 4 €. Que proposer ?","choices":["La livraison car elle est toujours plus rapide.","Un déplacement sans confirmation.","Le retrait confirmé ce soir, compatible avec son besoin.","Aucune solution."],"answers":[2],"reason":"Le retrait est confirmé et respecte ici le délai."},"min":5,"documents":"<div class=\"scene\"><b>Nouveau dossier : Yacine</b><p>Yacine doit recevoir un sac avant vendredi 18 h. Budget maximum : 35 €. Il ne peut pas se déplacer. Sac : 30 €. Livraison : 4 €, arrivée confirmée jeudi. Retrait : gratuit au magasin Gare vendredi.</p></div>","hints":["Distinguez les faits confirmés des suppositions. Relisez les documents et écartez les promesses non vérifiées.","Sélectionnez uniquement les informations utiles. Respectez ensuite les étapes annoncées dans la consigne."]},{"type":"summary","title":"Bilan de votre mission","min":3,"html":"<p>Vous savez choisir un service à partir des contraintes d’un client et construire un message professionnel fiable.</p><p>Expliquez à votre voisin pourquoi la solution retenue pour Inès diffère de celle proposée à Yacine.</p><p><b>Merci pour votre implication et la qualité de votre travail.</b></p><p>Les résultats de cette mission sont enregistrés sur ce navigateur. Les trois quiz des missions précédentes restent dans Google Forms.</p>"}]}],"lexicon":[{"categorie":"Caisse","terme":"Fonds de caisse","definition_courte":"Somme d’argent disponible dans la caisse au début du service pour rendre la monnaie.","exemple_professionnel":"Avant l’ouverture, l’équipier vérifie le fonds de caisse.","page_source":12,"priorite_omnicanal":false,"id":"fonds-de-caisse"},{"categorie":"Caisse","terme":"Matériel de caisse","definition_courte":"Ensemble des équipements servant à enregistrer et encaisser les ventes.","exemple_professionnel":"L’équipier utilise le lecteur de code-barres et le terminal de paiement.","page_source":12,"priorite_omnicanal":false,"id":"materiel-de-caisse"},{"categorie":"Caisse","terme":"Moyens de paiement","definition_courte":"Différentes façons de régler un achat : espèces, carte, chèque ou paiement mobile, selon les moyens acceptés.","exemple_professionnel":"La cliente règle ses achats avec son téléphone.","page_source":12,"priorite_omnicanal":false,"id":"moyens-de-paiement"},{"categorie":"Calculs commerciaux","terme":"Marge commerciale","definition_courte":"Différence entre les ventes de marchandises hors taxes et leur coût d’achat.","exemple_professionnel":"L’enseigne compare ses ventes au coût d’achat des articles vendus.","page_source":12,"priorite_omnicanal fre commerciale temporaire visant à stimuler les ventes, selon les règles applicables.","exemple_professionnel":"Une remise est annoncée sur une sélection de produits.","page_source":15,"priorite_omnicanal":false,"id":"promotion"},{"categorie":"Produit / marchandise","terme":"Services associés","definition_courte":"Prestations supplémentaires accompagnant l’achat d’un produit ou d’un service.","exemple_professionnel":"Le magasin propose la livraison ou un service d’installation.","page_source":15,"priorite_omnicanal":true,"id":"services-associes"},{"categorie":"Réglementation des produits","terme":"Chaîne du froid","definition_courte":"Ensemble des étapes qui maintiennent un produit à la température adaptée jusqu’à sa remise au consommateur.","exemple_professionnel":"L’équipier range rapidement les produits frais à la température requise.","page_source":16,"priorite_omnicanal":false,"id":"chaine-du-froid"},{"categorie":"Réglementation des produits","terme":"Date de congélation","definition_courte":"Information indiquant la date à laquelle un produit a été congelé, lorsque cette mention est requise.","exemple_professionnel":"L’équipier vérifie l’étiquette d’un produit congelé.","page_source":16,"priorite_omnicanal":false,"id":"date-de-congelation"},{"categorie":"Réglementation des produits","terme":"Date de durabilité minimale (DDM)","definition_courte":"Date après laquelle un produit peut perdre certaines qualités sans être nécessairement dangereux.","exemple_professionnel":"L’équipier repère une DDM avec la mention « à consommer de préférence avant ».","page_source":16,"priorite_omnicanal":false,"id":"date-de-durabilite-minimale-ddm"},{"categorie":"Réglementation des produits","terme":"Date limite de consommation (DLC)","definition_courte":"Date après laquelle un aliment très périssable ne doit plus être consommé.","exemple_professionnel":"L’équipier retire du rayon un produit dont la DLC est dépassée.","page_source":16,"priorite_omnicanal":false,"id":"date-limite-de-consommation-dlc"},{"categorie":"Réglementation des produits","terme":"Direction départementale de la protection des populations (DDPP)","definition_courte":"Service de l’État participant notamment à la protection des consommateurs et aux contrôles sanitaires.","exemple_professionnel":"La DDPP peut contrôler le respect de certaines règles sanitaires.","page_source":16,"priorite_omnicanal":false,"id":"direction-departementale-de-la-protection-des-populations-ddpp"},{"categorie":"Réglementation des produits","terme":"Édition des étiquettes prix et produits","definition_courte":"Préparation d’étiquettes comportant les mentions nécessaires pour identifier un produit et informer le client.","exemple_professionnel":"L’équipier imprime une étiquette indiquant le prix au kilogramme.","page_source":16,"priorite_omnicanal":false,"id":"edition-des-etiquettes-prix-et-produits"},{"categorie":"Réglementation des produits","terme":"Signes d’identification de l’origine et de la qualité","definition_courte":"Signes officiels signalant une origine, une qualité ou un mode de production reconnu.","exemple_professionnel":"Le client repère un produit portant le Label Rouge ou une AOP.","page_source":16,"priorite_omnicanal":false,"id":"signes-didentification-de-lorigine-et-de-la-qualite"},{"categorie":"Réserve du point de vente et stockage","terme":"Adressage","definition_courte":"Système de repérage codé des emplacements de stockage.","exemple_professionnel":"L’emplacement B-03 permet de retrouver rapidement un carton.","page_source":16,"priorite_omnicanal":true,"id":"adressage"},{"categorie":"Réserve du point de vente et stockage","terme":"Cadencier","definition_courte":"Outil de suivi des ventes et des commandes pour aider à éviter les ruptures de stock.","exemple_professionnel":"L’équipe consulte le cadencier avant de commander de nouveaux articles.","page_source":16,"priorite_omnicanal":false,"id":"cadencier"},{"categorie":"Réserve du point de vente et stockage","terme":"Capacité de stockage","definition_courte":"Quantité maximale de marchandises qu’un espace de stockage peut accueillir.","exemple_professionnel":"Le responsable vérifie combien de cartons peuvent être rangés.","page_source":16,"priorite_omnicanal":false,"id":"capacite-de-stockage"},{"categorie":"Réserve du point de vente et stockage","terme":"Inventaire","definition_courte":"Opération consistant à compter les marchandises en stock.","exemple_professionnel":"Les équipiers comptent les articles pour comparer le réel au stock indiqué.","page_source":16,"priorite_omnicanal":true,"id":"inventaire"},{"categorie":"Réserve du point de vente et stockage","terme":"Réserve","definition_courte":"Espace où les marchandises sont stockées avant leur mise en rayon ou leur préparation.","exemple_professionnel":"L’équipier récupère en réserve une commande à retirer.","page_source":16,"priorite_omnicanal":true,"id":"reserve"},{"categorie":"Réserve du point de vente et stockage","terme":"Rotation des produits","definition_courte":"Organisation du renouvellement des articles, notamment selon les dates ou les règles de sortie du stock.","exemple_professionnel":"Les produits aux dates les plus proches sont placés devant.","page_source":16,"priorite_omnicanal":false,"id":"rotation-des-produits"},{"categorie":"Réserve du point de vente et stockage","terme":"Rupture de stock","definition_courte":"Situation où la quantité disponible ne suffit plus à répondre à la demande.","exemple_professionnel":"Le client souhaite une taille qui n’est plus disponible.","page_source":16,"priorite_omnicanal":true,"id":"rupture-de-stock"}],"forms":{"M1":"https://docs.google.com/forms/d/e/1FAIpQLSe3AuSp67UO42Yl4OgcIkrRFa-xQQ3g2hcTv0XHWNYznlB9dA/viewform","M2":"https://docs.google.com/forms/d/e/1FAIpQLSdHsUyUc_quSz_36cAB2aQ-ZASS2xNx_cWvI9I6j8pwTuVNkQ/viewform","M3":"https://docs.google.com/forms/d/e/1FAIpQLSdwYQxr7gBHerktpm_PmViSpkK4r0Vy3Z2j9s8vf6Xm1gdIjQ/viewform","M4":"https://docs.google.com/forms/d/e/1FAIpQLSdEm4g9qAYEqGMfaSSXXTeJysA9t-eK3AfE2W7gT9H-tYz0OQ/viewform","M5":"https://docs.google.com/forms/d/e/1FAIpQLSfs9x8gJf11KfpVHQmEaC4eivwLVVUA6ZRPN0UvFDDUiLiPfQ/viewform","M6":"https://docs.google.com/forms/d/e/1FAIpQLScvC2UEs7RcpzrCUIZlUdONczduNGNdp1KDSuEOuQjBobBlSQ/viewform"}};
</script><script>
'use strict';
const D = window.APP_DATA;
const STORAGE_KEY = 'balavoine_2epc_omnicanal_2026_v1';
const emptyState = () => ({view:'home',m:0,s:0,activities:{},texts:{},formDone:{},vocab:{total:0,streak:0,best:{10:0,20:0,30:0},correct:0,attempts:0},finished:{},completedSteps:{}});
let st = emptyState();
try { st = {...emptyState(),...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}; }catch(e){}
if(!st.activities) st.activities = {};
if(!st.assemblies) st.assemblies={};
if(!st.simulations) st.simulations={};
if(!st.rewarded) st.rewarded={};
if(!Number.isFinite(st.practicePoints)) st.practicePoints=0;
if(!st.texts) st.texts = {};
if(!st.formDone) st.formDone = {};
if(!st.finished) st.finished = {};
if(!st.completedSteps) st.completedSteps = {};
st.vocab = {...emptyState().vocab,...(st.vocab||{})};
let teacher = false;
let vocabQ = null;
let vocabMode = {target:10,category:'priority'};
let vocabSeen = [];
let vocabFeedback = null;
const el = (id)=>document.getElementById(id);
const h = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(st))}catch(e){}}
function key(){return D.missions[st.m].key+':'+st.s}
function current(){return D.missions[st.m].steps[st.s]}
function getAct(){return st.activities[key()]||{sel:[],attempts:0,passed:false,reason:false,needsTransfer:false,transferSel:[],transferAttempts:0,transferDone:false,transferReason:false}}
function setAct(a){st.activities[key()]=a;save()}
function exact(a,b){return a.length===b.length && a.every(x=>b.includes(x))}
function updateOverall(){const done=D.missions.reduce((z,m)=>z+m.steps.filter((s,i)=>st.completedSteps[m.key+':'+i]).length,0);const total=D.missions.reduce((z,m)=>z+m.steps.length,0);el('overallBar').style.width=(100*done/total)+'%'}
function isDone(k,s,mkey){if(s.type==='assemble'){const a=st.assemblies[k];return Boolean(a?.passed&&(!a.needsTransfer||a.transferDone)||st.texts[k]?.compared&&st.completedSteps[k])}if(s.type==='simulation')return Boolean(st.simulations[k]?.passed);if(s.type==='choice'){const a=st.activities[k];return Boolean(a&&a.passed&&(!a.needsTransfer||a.transferDone))}if(s.type==='write'){const x=st.texts[k];return Boolean(x&&x.text?.trim().length>=20&&x.compared)}if(s.type==='form')return Boolean(st.formDone[mkey]);return true;}
function goHome(){st.view='home';save();render()}
function enterMission(i){st.view='mission';st.m=i;st.s=0;save();render()}
function goStep(delta){const m=D.missions[st.m];if(delta>0&&!isDone(key(),current(),m.key)){alert('Terminez cette étape avant de continuer.');return}if(delta>0)st.completedSteps[key()]=true;if(delta>0&&st.s===m.steps.length-1){st.finished[m.key]=true;if(st.m<D.missions.length-1){st.m++;st.s=0;}else{st.view='home'}}else if(delta<0&&st.s===0){if(st.m>0){st.m--;st.s=D.missions[st.m].steps.length-1}}else {st.s+=delta}save();render();window.scrollTo(0,0)}
function jump(i){st.view='mission';st.m=i;st.s=0;save();render()}
function toggleTeacher(){teacher=!teacher;el('teacherBtn').setAttribute('aria-pressed',String(teacher));el('teacherBtn').textContent=teacher?'✅ Mode enseignant':'👨‍🏫 Enseignant';render()}
function shell(content){const sidebar=`<aside class="side"><div class="sidehead">Mes quatre missions</div>${D.missions.map((m,i)=>{let finished=st.finished[m.key]?'✓ ':'',active=st.view==='mission'&&st.m===i?' active':'';return `<button type="button" class="sidebtn${active}" onclick="jump(${i})">${finished}Mission ${i+1} · ${h(m.title)}<span class="small">${m.steps.length} étapes · 55 min avec correction</span></button>`}).join('')}<hr class="sidehr"><button class="sidebtn${st.view==='lexicon'?' active':''}" onclick="showLexicon()">📖 Dictionnaire (79 termes)</button><button class="sidebtn${st.view==='vocab'?' active':''}" onclick="showVocab()">🎯 Défi vocabulaire 10 / 20 / 30</button><hr class="sidehr"><button class="sidebtn" onclick="goHome()">⌂ Tableau de bord</button></aside>`;el('app').innerHTML=`<div class="maincols">${sidebar}<section id="working">${content}</section></div>`;updateOverall()}
function render(){switch(st.view){case 'mission':return renderMission();case 'lexicon':return renderLexicon();case 'vocab':return renderVocab();default:return renderHome()}}
function renderHome(){const doneCount=D.missions.filter(m=>st.finished[m.key]).length;const tiles=D.missions.map((m,i)=>`<div class="tile"><span class="chip">Séance ${i+1} · 55 min</span><h3>${h(m.title)}</h3><p>${h(m.goal)}</p><button class="btn" onclick="jump(${i})">${st.finished[m.key]?'Revoir':'Ouvrir la mission'} →</button></div>`).join('');shell(`<div class="card welcome"><div class="kicker">Bienvenue dans votre espace d’apprentissage</div><h2>Quatre missions pour comprendre et pratiquer le commerce connecté.</h2><p>Lisez une courte explication, faites vos choix et consultez la correction avant de continuer. Les messages professionnels se construisent avec des phrases proposées.</p><div class="chips"><span class="chip">💻 Ordinateur recommandé</span><span class="chip">📱 Téléphone compatible</span><span class="chip">📝 3 Google Forms</span><span class="chip green">💾 Reprise sur ce navigateur</span></div><p class="sub">Attention : sur un ordinateur partagé, les progrès restent enregistrés dans le navigateur, et non sur un compte personnel. Évitez de laisser des données personnelles dans les productions.</p><div class="progresscards"><div><b>${doneCount}/${D.missions.length}</b>Missions terminées</div><div><b>${st.vocab.total+(st.practicePoints||0)}</b>Points de pratique</div><div><b>${st.vocab.streak}</b>Bonne(s) réponse(s) d'affilée</div></div></div><div class="tilegrid">${tiles}<div class="tile"><span class="chip green">Entraînement illimité</span><h3>📖 Vocabulaire professionnel</h3><p>79 termes · consulter ou s’entraîner par défis de 10, 20 ou 30 réponses consécutives.</p><button class="btn green" onclick="showVocab()">S'entraîner →</button></div></div>${teacher?'<div class="teacherBox"><b>Conducteur enseignant</b><p>Chaque mission propose environ 46 min d’activités et un temps collectif de 9 min. Démarrage 5 min, autonomie 35–40 min, bilan 10 min. Les durées sont indicatives. Les réponses attendues sont affichées dans le mode enseignant.</p></div>':''}`)}
function renderMission(){const m=D.missions[st.m],s=current(),k=key();const index=st.s,total=m.steps.length,pct=Math.round(100*(index+1)/total),done=isDone(k,s,m.key);let body='';if(s.type==='lesson')body=`<div class="lessonbody">${s.html}</div>`;
if(s.type==='choice')body=renderChoice(s,k);
if(s.type==='assemble')body=renderAssembly(s,k);
if(s.type==='simulation')body=renderSimulation(s,k);
if(s.type==='form')body=renderForm(s,m.key);
if(s.type==='summary')body=`<div class="note">${s.html}</div><p class="sub">Avant de continuer, expliquez à voix haute ce que vous avez retenu.</p>`;
const teacherHtml=teacher?`<div class="teacherBox"><h4>👨‍🏫 Notes enseignant</h4><p>Mission : ${h(m.goal)}</p><p>Étape : ${h(s.title)}. Durée indicative : ${s.min} min.</p>${s.type==='choice'?`<p><b>Réponse :</b> ${s.answers.map(i=>h(s.choices[i])).join(' ; ')}</p><p><b>Explication :</b> ${s.reason}</p>`:''}${s.type==='assemble'?`<p><b>Ordre attendu :</b> ${s.order.map(i=>h(s.bank[i].text)).join(' → ')}</p><p>${h(s.reason)}</p>`:''}${s.type==='simulation'?'<p>Attendu : pointure 39, magasin Gare, retrait jeudi après confirmation. 60 € au total. Observer la lecture des contraintes, les choix et la justification. Temps M4 : 5 + 5 + 5 + 8 + 5 + 4 + 7 + 3 + 5 + 5 + 3 = 55 min. Critères : besoin identifié, données exactes, service adapté, message fiable. Compétence principale du bloc 3 : Accompagner le parcours client dans un contexte omnicanal ; compétence détaillée : Accompagner le client dans l’utilisation des outils digitaux. Prérequis : canaux et parcours client (missions 1–3). Savoirs : demande du client, services, outils d’aide à la vente, procédures. Posture : écoute, fiabilité, respect de la procédure.</p>':''}${s.type==='form'?'<p>Vérifier côté Forms : notes immédiates, bonnes réponses et commentaires explicatifs. La coche de l’élève ne prouve pas un envoi.</p>':''}</div>`:'';
shell(`<div class="card pageIntro"><div class="kicker">Mission ${st.m+1} / ${D.missions.length} · ${h(m.goal)}</div><h2>${h(m.title)}</h2><div class="stepbar"><div><span style="width:${pct}%"></span></div><small>Étape ${index+1}/${total}</small></div><div class="chips"><span class="chip">${h(({lesson:'Je découvre',choice:'Je réfléchis',assemble:'Je construis un message',simulation:'Je manipule',write:'Je produis',form:'Je me teste',summary:'Je retiens'})[s.type])}</span><span class="chip">≈ ${s.min} min</span></div></div><div class="card"><div class="taskLabel">Action ${index+1}</div><h3>${h(s.title)}</h3>${body}${teacherHtml}</div><div class="actions"><button class="btn secondary" onclick="goStep(-1)" ${st.m===0&&st.s===0?'disabled':''}>← Retour</button><div><button class="btn" onclick="goStep(1)" ${done?'':'disabled'}>${index===total-1?'Mission suivante / terminer →':'Je continue →'}</button></div></div><p class="reviewLine">Le bouton « Je continue » s’active après la réponse, le feedback et, si besoin, la remédiation. Vous pouvez revoir les étapes précédentes.</p>`)}
function optionButtons(choices,sel,prefix,multi){return `<div class="options" role="group" aria-label="Réponses proposées">${choices.map((c,i)=>`<button type="button" class="option${sel.includes(i)?' selected':''}" onclick="${prefix}(${i})" aria-pressed="${sel.includes(i)}"><span class="marker">${sel.includes(i)?'✓':String.fromCharCode(65+i)}</span><span>${h(c)}</span></button>`).join('')}</div><div class="reviewLine">${multi?'Plusieurs réponses possibles. Sélectionne toutes les réponses justes.':'Une seule réponse correcte.'}</div>`}
function renderChoice(s,k){const a=getAct(),multi=s.answers.length>1,pass=a.passed;let out=`<div class="question">${s.prompt}</div>${!pass?optionButtons(s.choices,a.sel,'pickAnswer',multi):`<div class="feedback"><b>✅ Correction de la situation</b><p>${s.reason}</p></div>`}`;
if(!pass){out+=`<button class="btn" onclick="checkAnswer()" ${!a.sel.length?'disabled':''}>Valider ma réponse</button>`;if(a.attempts>0){out+=`<div class="feedback error"><b>${a.attempts<3?'Réfléchis à nouveau.':'Réponse expliquée après plusieurs essais'}</b><p>${a.attempts===1?s.hints[0]:a.attempts===2?s.hints[1]:s.reason}</p>${a.attempts>=3?`<p>La réponse attendue est : <b>${s.answers.map(i=>h(s.choices[i])).join(' ; ')}</b>. Tu vas maintenant t’entraîner sur une situation différente.</p><button class="btn" onclick="revealAndTransfer()">Passer à la remédiation</button>`:''}</div>`}}
if(pass&&a.needsTransfer&&!a.transferDone){out+=`<div class="card" style="margin:13px 0;background:#f8fbff"><h3>🔁 Nouvelle situation — remédiation</h3><div class="question">${h(s.transfer.prompt)}</div>${optionButtons(s.transfer.choices,a.transferSel,'pickTransfer',s.transfer.answers.length>1)}<button class="btn" onclick="checkTransfer()" ${!a.transferSel.length?'disabled':''}>Vérifier ce nouvel exemple</button>${a.transferAttempts?`<div class="hint"><b>${a.transferAttempts===1?'Indice':'Explication'}</b><p>${a.transferAttempts===1?'Repère ce qui change par rapport au premier exemple.':s.transfer.reason}</p></div>`:''}</div>`}
if(pass&&a.needsTransfer&&a.transferDone)out+=`<div class="feedback"><b>✅ Remédiation terminée</b><p>${s.transfer.reason}</p></div>`;
return out}
function pickAnswer(i){const a=getAct(),s=current();if(a.passed)return;const k=s.answers.length>1; a.sel=k?(a.sel.includes(i)?a.sel.filter(x=>x!==i):[...a.sel,i]):[i];setAct(a);render()}
function checkAnswer(){const a=getAct(),s=current();if(!a.sel.length)return;if(exact(a.sel,s.answers)){a.passed=true;awardPractice(key());a.reason=true;a.needsTransfer=a.attempts>0;a.transferDone=!a.needsTransfer;setAct(a);render();return}a.attempts++;a.sel=[];if(a.attempts>=3){a.needsTransfer=true}setAct(a);render()}
function revealAndTransfer(){const a=getAct();if(a.attempts<3)return;a.passed=true;a.needsTransfer=true;a.transferDone=false;setAct(a);render()}
function pickTransfer(i){const a=getAct(),s=current(),multi=s.transfer.answers.length>1;a.transferSel=multi?(a.transferSel.includes(i)?a.transferSel.filter(x=>x!==i):[...a.transferSel,i]):[i];setAct(a);render()}
function checkTransfer(){const a=getAct(),s=current();if(exact(a.transferSel,s.transfer.answers)){a.transferDone=true}else{a.transferAttempts++;if(a.transferAttempts>=3)a.transferDone=true}a.transferSel=[];setAct(a);render()}

function awardPractice(k){if(!st.rewarded[k]){st.rewarded[k]=true;st.practicePoints++;save()}}
function assemblyState(){return st.assemblies[key()]||{selected:[],attempts:0,passed:false,needsTransfer:false,transferDone:false,transferSelected:-1}}
function setAssembly(a){st.assemblies[key()]=a;save()}
function assemblyOrderOK(selected,expected){return selected.length===expected.length&&selected.every((x,i)=>x===expected[i])}
function addSentence(i){const a=assemblyState(),s=current();if(a.passed||a.selected.includes(i)||a.selected.length>=s.order.length)return;a.selected.push(i);a.feedback=false;setAssembly(a);render()}
function removeSentence(pos){const a=assemblyState();if(a.passed)return;a.selected.splice(pos,1);a.feedback=false;setAssembly(a);render()}
function moveSentence(pos,direction){const a=assemblyState(),dest=pos+direction;if(a.passed||dest<0||dest>=a.selected.length)return;[a.selected[pos],a.selected[dest]]=[a.selected[dest],a.selected[pos]];a.feedback=false;setAssembly(a);render()}
function checkAssembly(){const a=assemblyState(),s=current();if(a.passed||a.selected.length!==s.order.length)return;a.attempts++;a.feedback=true;if(assemblyOrderOK(a.selected,s.order)){a.passed=true;a.needsTransfer=a.attempts>1;awardPractice(key())}setAssembly(a);render()}
function showAssemblySolution(){const a=assemblyState();if(a.attempts<3)return;a.selected=[...current().order];a.passed=true;a.feedback=true;a.needsTransfer=true;a.assisted=true;setAssembly(a);render()}
function chooseAssemblyTransfer(i){const a=assemblyState();if(a.transferDone)return;a.transferSelected=i;setAssembly(a);render()}
function checkAssemblyTransfer(){const a=assemblyState(),t=current().transfer;if(a.transferSelected<0||a.transferDone)return;a.transferAttempts=(a.transferAttempts||0)+1;a.transferError=!t.answers.includes(a.transferSelected);if(!a.transferError){a.transferDone=true;awardPractice(key()+':transfer')}setAssembly(a);render()}
function courseReference(){return current().type==='assemble'&&st.m===3?5:st.m===3?2:2}
function openSupport(){st.supportOpen=!st.supportOpen;save();render()}
function supportPanel(){if(!st.supportOpen)return '';const m=D.missions[st.m],s=m.steps[courseReference()];return `<div class="hint"><h4>Rappel du cours</h4>${s.html||'<p>Vérifiez les faits et les étapes du parcours avant de choisir une phrase.</p>'}<button class="btn secondary" onclick="openSupport()">Fermer le rappel et reprendre</button></div>`}
function renderAssembly(s,k){const a=assemblyState(),legacy=st.texts[k]?.compared&&st.completedSteps[k];let out=`${s.documents||''}<div class="question">${h(s.prompt)}</div><p>Choisissez ${s.order.length} phrases parmi ${s.bank.length}. Cliquez pour les ajouter, puis utilisez les flèches pour les ordonner. Vous pouvez retirer une phrase et la remplacer.</p>${legacy&&!a.passed?'<p class="note">Votre validation précédente est conservée. Ce nouveau format reste disponible pour vous entraîner.</p>':''}<h4>Votre message (${a.selected.length}/${s.order.length})</h4><ol class="message-list">${a.selected.map((i,pos)=>`<li><p>${h(s.bank[i].text)}</p>${!a.passed?`<div class="sentence-tools"><button class="btn secondary" aria-label="Monter la phrase ${pos+1}" onclick="moveSentence(${pos},-1)" ${pos===0?'disabled':''}>↑</button><button class="btn secondary" aria-label="Descendre la phrase ${pos+1}" onclick="moveSentence(${pos},1)" ${pos===a.selected.length-1?'disabled':''}>↓</button><button class="btn secondary" aria-label="Retirer la phrase ${pos+1}" onclick="removeSentence(${pos})">Retirer</button></div>`:''}</li>`).join('')}</ol>${!a.selected.length?'<p class="empty">Votre message apparaîtra ici.</p>':''}`;
if(!a.passed){out+=`<h4>Banque de phrases</h4><div class="options">${s.bank.map((p,i)=>`<button class="option" onclick="addSentence(${i})" ${a.selected.includes(i)||a.selected.length>=s.order.length?'disabled':''}>${a.selected.includes(i)?'✓ ':''}${h(p.text)}</button>`).join('')}</div><button class="btn" onclick="checkAssembly()" ${a.selected.length!==s.order.length?'disabled':''}>Vérifier mon message</button>`;if(a.feedback){const wrong=a.selected.filter(i=>!s.order.includes(i));out+=`<div class="feedback error" role="status"><b>Votre message doit être ajusté.</b>${wrong.map(i=>`<p>« ${h(s.bank[i].text)} » : ${h(s.bank[i].why)}</p>`).join('')}${!wrong.length?'<p>Les phrases sont pertinentes. Leur ordre ne suit pas encore les étapes de la consigne.</p>':''}<p>${h(s.hints[Math.min(a.attempts-1,1)])}</p><button class="btn secondary" onclick="openSupport()">Relire le cours sans quitter mon message</button>${a.attempts>=3?'<p>Après trois essais, vous pouvez consulter le modèle puis réussir une nouvelle situation.</p><button class="btn secondary" onclick="showAssemblySolution()">Consulter le modèle et passer au transfert</button>':''}</div>`}}
if(a.passed){out+=`<div class="feedback" role="status"><b>${a.assisted?'Modèle expliqué':'Message professionnel validé · +1 point'}</b><p>${h(s.reason)}</p></div><details><summary>Comprendre les phrases retenues et les distracteurs</summary>${s.bank.map((p,i)=>`<p><b>${s.order.includes(i)?'À retenir':'À écarter'} :</b> ${h(p.text)}<br>${h(p.why)}</p>`).join('')}</details>`;if(a.needsTransfer&&!a.transferDone){out+=`<div class="card"><h3>Nouvelle situation à résoudre</h3><p>${h(s.transfer.prompt)}</p>${optionButtons(s.transfer.choices,a.transferSelected<0?[]:[a.transferSelected],'chooseAssemblyTransfer',false)}<button class="btn" onclick="checkAssemblyTransfer()" ${a.transferSelected<0?'disabled':''}>Valider la nouvelle situation</button>${a.transferError?`<div class="hint"><p>${h(s.transfer.reason)}</p><p>Choisissez la réponse cohérente avec cette explication, puis validez.</p></div>`:''}</div>`}if(a.transferDone)out+=`<div class="feedback"><b>Transfert réussi</b><p>${h(s.transfer.reason)}</p></div>`}
return out+supportPanel()}
function simState(){return st.simulations[key()]||{size:'',store:'',service:'',checkedStock:false,attempts:0,passed:false}}
function setSimulation(a){st.simulations[key()]=a;save()}
function simChange(field,value){const a=simState();if(a.passed)return;a[field]=value;a.feedback=false;if(field==='size'||field==='store')a.checkedStock=false;setSimulation(a);render()}
function consultStock(){const a=simState();if(!a.size||!a.store)return;a.checkedStock=true;setSimulation(a);render()}
function checkSimulation(){const a=simState();if(a.passed)return;a.attempts++;a.feedback=true;a.passed=a.size==='39'&&a.store==='gare'&&a.service==='retrait'&&a.checkedStock;if(a.passed)awardPractice(key());setSimulation(a);render()}
function renderSimulation(s,k){const a=simState(),options=(items,v)=>'<option value="">Choisissez…</option>'+items.map(([id,label])=>`<option value="${id}" ${v===id?'selected':''}>${h(label)}</option>`).join('');let stock='';if(a.checkedStock){stock=a.size==='39'?(a.store==='gare'?'2 paires disponibles. Retrait proposé jeudi à partir de 18 h, après confirmation de préparation.':'0 paire. Réapprovisionnement lundi.'): 'Pointure 38 disponible ; elle ne correspond pas à la demande d’Inès.'}return `${s.documents}<div class="catalogue"><div class="kicker">Simulation · aucun achat réel</div><h3>Nova Sport · Baskets Sprint bleues · 60 €</h3><label>Pointure<select id="sim-size" onchange="simChange('size',this.value)" ${a.passed?'disabled':''}>${options([['38','38'],['39','39']],a.size)}</select></label><label>Magasin à consulter<select id="sim-store" onchange="simChange('store',this.value)" ${a.passed?'disabled':''}>${options([['centre','Centre'],['gare','Gare']],a.store)}</select></label><button class="btn secondary" onclick="consultStock()" ${!a.size||!a.store||a.passed?'disabled':''}>Consulter la disponibilité</button>${a.checkedStock?`<div class="note" role="status">${h(stock)}</div>`:''}<label>Service à proposer<select id="sim-service" onchange="simChange('service',this.value)" ${a.passed?'disabled':''}>${options([['retrait','Retrait au magasin sélectionné · 60 € au total'],['livraison','Livraison à domicile lundi · 65 € au total']],a.service)}</select></label><p>Choisissez la combinaison qui respecte la pointure, le budget, le délai et le déplacement d’Inès.</p><button class="btn" onclick="checkSimulation()" ${!a.size||!a.store||!a.service||!a.checkedStock||a.passed?'disabled':''}>Vérifier ma proposition</button></div>${a.feedback?`<div class="feedback ${a.passed?'':'error'}" role="status"><b>${a.passed?'Solution adaptée · +1 point':'Reprenez les contraintes de la cliente'}</b>${a.passed?'<p>La pointure 39 à Gare, avec retrait gratuit jeudi après confirmation, respecte les quatre contraintes. Le total est de 60 €. Aucune commande réelle n’a été passée.</p>':`${a.size!=='39'?'<p>Le modèle doit être choisi en pointure 39.</p>':''}${a.store!=='gare'?'<p>Centre ne disposera pas de cette pointure avant lundi.</p>':''}${a.service!=='retrait'?'<p>La livraison arrive lundi et coûte 65 € : délai et budget ne conviennent pas.</p>':''}<p>Modifiez vos choix puis consultez de nouveau le stock si vous changez de magasin ou de pointure.</p><button class="btn secondary" onclick="openSupport()">Consulter le rappel du cours</button>`}</div>`:''}${supportPanel()}`}

function renderForm(s,mkey){const url=D.forms[mkey];return `<div class="formBox"><h3>📝 Quiz ${mkey} — 5 questions / 5</h3><p>Ouvre le Google Form, sélectionne ton nom, réponds aux cinq questions et envoie. Consulte ta note et les explications si le Form a été configuré pour les afficher immédiatement.</p><a class="btn purple" href="${h(url)}" target="_blank" rel="noopener noreferrer">Ouvrir le Google Form ↗</a><div class="alert"><b>Important :</b> le formulaire s’ouvre dans un autre onglet. Reviens dans cette application après l'envoi. La note reste dans Google Forms, elle n’est pas récupérée ici.</div><label style="display:flex;gap:10px;align-items:start;margin-top:14px"><input type="checkbox" ${st.formDone[mkey]?'checked':''} onchange="confirmForm(this.checked)" style="width:20px;height:20px;margin-top:4px"><span>J'ai envoyé mes réponses et consulté mon résultat.</span></label></div>`}
function confirmForm(v){st.formDone[D.missions[st.m].key]=v;save();render()}
function showLexicon(){st.view='lexicon';save();render()}
function renderLexicon(){const cats=[...new Set(D.lexicon.map(x=>x.categorie))].sort();shell(`<div class="card welcome"><div class="kicker">Banque de vocabulaire CAP EPC</div><h2>79 termes professionnels, expliqués simplement</h2><p>Une définition courte et un exemple en magasin pour chaque terme. Les termes prioritaires de la séquence sont signalés.</p><div class="searchrow"><input id="searchLex" type="search" placeholder="Rechercher un mot ou une définition…" oninput="filterLex()" aria-label="Rechercher un terme"><select id="catLex" onchange="filterLex()"><option value="">Tous les thèmes</option><option value="!priority">Prioritaires omnicanal</option>${cats.map(x=>`<option value="${h(x)}">${h(x)}</option>`).join('')}</select></div><p class="sub" id="lexCount"></p></div><div id="lexResults" class="lexgrid"></div>`);filterLex()}
function filterLex(){const term=el('searchLex').value.toLocaleLowerCase('fr').trim(),cat=el('catLex').value;const items=D.lexicon.filter(x=>(!cat||(cat==='!priority'?x.priorite_omnicanal:x.categorie===cat))&&[x.terme,x.definition_courte,x.exemple_professionnel].some(y=>y.toLocaleLowerCase('fr').includes(term)));el('lexCount').textContent=items.length+' termes affichés';el('lexResults').innerHTML=items.map(x=>`<div class="lexitem"><span class="cat">${h(x.categorie)} ${x.priorite_omnicanal?'· ★ Prioritaire':''}</span><b>${h(x.terme)}</b><p>${h(x.definition_courte)}</p><small>Exemple : ${h(x.exemple_professionnel)}</small></div>`).join('')||'<p>Aucun terme trouvé.</p>'}
function showVocab(){st.view='vocab';save();vocabQ=null;vocabFeedback=null;render()}
function chooseVocabTarget(v){vocabMode.target=Number(v);vocabQ=null;vocabFeedback=null;render()}
function chooseVocabCategory(v){vocabMode.category=v;vocabQ=null;vocabFeedback=null;render()}
function vocabPool(){return D.lexicon.filter(x=>vocabMode.category==='all'||(vocabMode.category==='priority'?x.priorite_omnicanal:x.categorie===vocabMode.category))}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function newVocabQuestion(){let pool=vocabPool();if(!pool.length)return;let unused=pool.filter(x=>!vocabSeen.includes(x.id));if(!unused.length){vocabSeen=[];unused=pool}const entry=unused[Math.floor(Math.random()*unused.length)];vocabSeen.push(entry.id);const mode=(Math.random()<.5)?'definition':'example';let peers=pool.filter(x=>x.id!==entry.id&&x.categorie===entry.categorie);let groups={'Distribution des produits':['Organisation du point de vente','Communication','Préparation de commande et livraison'],'Préparation de commande et livraison':['Réserve du point de vente et stockage','Organisation du point de vente'],'Communication':['Clients','Distribution des produits']};peers=peers.concat(D.lexicon.filter(x=>x.id!==entry.id&&!peers.some(p=>p.id===x.id)&&(groups[entry.categorie]||[]).includes(x.categorie)));if(peers.length<3)peers=peers.concat(D.lexicon.filter(x=>x.id!==entry.id&&!peers.some(p=>p.id===x.id)));const opts=shuffle([entry,...shuffle(peers).slice(0,3)]);vocabQ={entry,opts,mode,selected:-1};vocabFeedback=null;render()}
function vocabSelect(i){if(vocabFeedback)return;vocabQ.selected=i;render()}
function vocabCheck(){if(!vocabQ||vocabQ.selected<0||vocabFeedback)return;const correct=vocabQ.opts[vocabQ.selected].id===vocabQ.entry.id;st.vocab.attempts++;if(correct){st.vocab.correct++;st.vocab.total++;st.vocab.streak++;st.vocab.best[vocabMode.target]=Math.max(st.vocab.best[vocabMode.target]||0,st.vocab.streak)}else{st.vocab.streak=0}vocabFeedback={correct,entry:vocabQ.entry};save();render()}
function renderVocab(){const cats=[...new Set(D.lexicon.map(x=>x.categorie))].sort(),v=st.vocab,goal=vocabMode.target,won=v.streak>=goal;let section='';if(vocabQ){const q=vocabQ;const text=q.mode==='definition'?`Quelle définition correspond au terme « ${h(q.entry.terme)} » ?`:`Quel terme professionnel correspond à cette situation : « ${h(q.entry.exemple_professionnel)} » ?`;section=`<div class="card"><div class="taskLabel">Défi ${goal} bonnes réponses de suite</div><h3>${text}</h3>${optionButtons(q.opts.map(x=>q.mode==='definition'?x.definition_courte:x.terme),q.selected<0?[]:[q.selected],'vocabSelect',false)}${!vocabFeedback?`<button class="btn" onclick="vocabCheck()" ${q.selected<0?'disabled':''}>Valider mon choix</button>`:`<div class="feedback ${vocabFeedback.correct?'':'error'}"><b>${vocabFeedback.correct?'✅ Bonne réponse +1 point':'❌ Une erreur : la série repart à zéro'}</b><p><b>${h(q.entry.terme)}</b> : ${h(q.entry.definition_courte)}</p><p><b>Exemple :</b> ${h(q.entry.exemple_professionnel)}</p><p>${vocabFeedback.correct?'Tu as identifié la notion. Lis l’exemple pour comprendre comment l’utiliser en magasin.':'Cette définition explique le mot attendu. Observe l’exemple avant de recommencer.'}</p></div><button class="btn green" onclick="newVocabQuestion()">Question suivante →</button>`}</div>`}else{section=`<div class="card"><h3>${won?'🏆 Défi réussi !':'Prêt pour une nouvelle question ?'}</h3><p>Chaque bonne réponse rapporte un point. Une erreur remet uniquement la série consécutive à zéro ; tes points déjà gagnés sont conservés.</p><button class="btn" onclick="newVocabQuestion()">${won?'Relever un nouveau défi':'Commencer le défi'} →</button></div>`}
shell(`<div class="card welcome"><div class="kicker">Entraînement indépendant</div><h2>Défi vocabulaire CAP EPC</h2><p>79 mots · des questions variées à quatre propositions · explication après chaque réponse.</p><div class="vocabControls"><label>Objectif : <select onchange="chooseVocabTarget(this.value)">${[10,20,30].map(n=>`<option ${goal===n?'selected':''} value="${n}">${n} bonnes réponses de suite</option>`).join('')}</select></label><label>Thème : <select onchange="chooseVocabCategory(this.value)"><option value="priority" ${vocabMode.category==='priority'?'selected':''}>18 prioritaires omnicanal</option><option value="all" ${vocabMode.category==='all'?'selected':''}>Tous les termes (79)</option>${cats.map(c=>`<option value="${h(c)}" ${vocabMode.category===c?'selected':''}>${h(c)}</option>`).join('')}</select></label></div><div class="vocabbar"><div><strong>${v.streak}/${goal}</strong>Série actuelle</div><div><strong>${v.total}</strong>Points gagnés</div><div><strong>${v.best[goal]||0}</strong>Record ${goal}</div></div></div>${section}`)}
el('homeBtn').onclick=goHome;el('teacherBtn').onclick=toggleTeacher;
render();

</script>
</body></html>
